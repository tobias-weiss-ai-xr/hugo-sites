version: '3.8'

services:
  traefik:
    image: traefik:v2.9
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.mytlschallenge.acme.tlschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.email=spam@tobias-weiss.org
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.graphwiz.ai`)"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.traefik-dash.service=api@internal"
    networks:
      - web

  hugo-chemie-lernen-org:
    build: ./hugo-chemie-lernen-org
    container_name: hugo-chemie-lernen-org
    command: hugo server --bind 0.0.0.0 --baseURL https://${HUGO_CHEMIE_DOMAIN} --appendPort=false
    working_dir: /app/myhugoapp
    volumes:
      - ./hugo-chemie-lernen-org/myhugoapp:/app/myhugoapp
      - ./hugo-chemie-lernen-org/public:/app/myhugoapp/public
    ports:
      - "1313:1313"
    environment:
      - HUGO_BASEURL=https://${HUGO_CHEMIE_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo-chemie.rule=Host(`${HUGO_CHEMIE_DOMAIN}`, `www.${HUGO_CHEMIE_DOMAIN}`)"
      - "traefik.http.routers.hugo-chemie.entrypoints=web"
      - "traefik.http.routers.hugo-chemie.middlewares=https-redirect@file"
      - "traefik.http.routers.hugo-chemie-secure.rule=Host(`${HUGO_CHEMIE_DOMAIN}`, `www.${HUGO_CHEMIE_DOMAIN}`)"
      - "traefik.http.routers.hugo-chemie-secure.entrypoints=websecure"
      - "traefik.http.routers.hugo-chemie-secure.tls=true"
      - "traefik.http.routers.hugo-chemie-secure.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hugo-chemie-secure.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.hugo-chemie.loadbalancer.server.port=1313"
      - "traefik.http.routers.hugo-pse.rule=Host(`pse.${HUGO_CHEMIE_DOMAIN}`)"
      - "traefik.http.routers.hugo-pse.entrypoints=websecure"
      - "traefik.http.routers.hugo-pse.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hugo-pse.middlewares=pse-redirect"
      - "traefik.http.middlewares.pse-redirect.redirectregex.regex=^https://pse\\.${HUGO_CHEMIE_DOMAIN}/.*"
      - "traefik.http.middlewares.pse-redirect.redirectregex.replacement=https://pse.${HUGO_CHEMIE_DOMAIN}/periodic-table/"
    networks:
      - web

  hugo-graphwiz-ai:
    build: ./hugo-graphwiz-ai
    container_name: hugo-graphwiz-ai
    command: hugo server --bind 0.0.0.0 --baseURL https://${HUGO_GRAPHVIZ_DOMAIN} --appendPort=false
    working_dir: /app/myhugoapp
    volumes:
      - ./hugo-graphwiz-ai/myhugoapp:/app/myhugoapp
      - ./hugo-graphwiz-ai/public:/app/myhugoapp/public
    ports:
      - "1314:1313"
    environment:
      - HUGO_BASEURL=https://${HUGO_GRAPHVIZ_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo-graphwiz.rule=Host(`${HUGO_GRAPHVIZ_DOMAIN}`, `www.${HUGO_GRAPHVIZ_DOMAIN}`, `graphwiz.de`, `www.graphwiz.de`)"
      - "traefik.http.routers.hugo-graphwiz.entrypoints=web"
      - "traefik.http.routers.hugo-graphwiz.middlewares=https-redirect@file"
      - "traefik.http.routers.hugo-graphwiz-secure.rule=Host(`${HUGO_GRAPHVIZ_DOMAIN}`, `www.${HUGO_GRAPHVIZ_DOMAIN}`, `graphwiz.de`, `www.graphwiz.de`)"
      - "traefik.http.routers.hugo-graphwiz-secure.entrypoints=websecure"
      - "traefik.http.routers.hugo-graphwiz-secure.tls=true"
      - "traefik.http.routers.hugo-graphwiz-secure.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hugo-graphwiz-secure.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.hugo-graphwiz.loadbalancer.server.port=1313"
    networks:
      - web

  hugo-tobias-weiss-org:
    build: ./hugo-tobias-weiss-org
    container_name: hugo-tobias-weiss-org
    command: hugo server --bind 0.0.0.0 --baseURL https://${HUGO_TOBIAS_DOMAIN} --appendPort=false
    working_dir: /app/myhugoapp
    volumes:
      - ./hugo-tobias-weiss-org/myhugoapp:/app/myhugoapp
      - ./hugo-tobias-weiss-org/public:/app/myhugoapp/public
    ports:
      - "1315:1313"
    environment:
      - HUGO_BASEURL=https://${HUGO_TOBIAS_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo-tobias.rule=Host(`${HUGO_TOBIAS_DOMAIN}`, `www.${HUGO_TOBIAS_DOMAIN}`, `next.${HUGO_TOBIAS_DOMAIN}`)"
      - "traefik.http.routers.hugo-tobias.entrypoints=web"
      - "traefik.http.routers.hugo-tobias.middlewares=https-redirect@file"
      - "traefik.http.routers.hugo-tobias-secure.rule=Host(`${HUGO_TOBIAS_DOMAIN}`, `www.${HUGO_TOBIAS_DOMAIN}`, `next.${HUGO_TOBIAS_DOMAIN}`)"
      - "traefik.http.routers.hugo-tobias-secure.entrypoints=websecure"
      - "traefik.http.routers.hugo-tobias-secure.tls=true"
      - "traefik.http.routers.hugo-tobias-secure.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hugo-tobias-secure.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.hugo-tobias.loadbalancer.server.port=1313"
    networks:
      - web

networks:
  web:
    driver: bridge

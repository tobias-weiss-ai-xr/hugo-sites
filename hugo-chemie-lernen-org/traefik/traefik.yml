# Traefik Configuration File
api:
  dashboard: true
  insecure: false  # Disable insecure dashboard for production

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "chemie-lernen.local"

# Let's Encrypt configuration (for production)
certificatesResolvers:
  letsencrypt:
    acme:
      email: your-email@example.com  # CHANGE THIS
      storage: acme.json
      httpChallenge:
        entryPoint: web
      tlsChallenge: true

# File configuration for dynamic configs
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    filename: /etc/traefik/dynamic.yml

# Logging
log:
  level: INFO

accessLog: {}
